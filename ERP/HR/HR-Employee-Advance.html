<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Add Advance Payment - Elghonemy POS</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Cairo:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6F4E37",
              "primary-dark": "#5D4037",
              "background-light": "#F5F5F0",
              "background-dark": "#1F1B18",
              "surface-light": "#FFFFFF",
              "surface-dark": "#2C2522",
              "border-light": "#E7E5E4",
              "border-dark": "#44403C",
              "text-main": "#3E2723",
              "text-dark": "#EFEBE9",
              "text-muted": "#8D6E63",
              accent: "#D7CCC8",
            },
            fontFamily: {
              display: ["Cairo", "Public Sans", "Noto Sans", "sans-serif"],
              sans: ["Cairo", "Public Sans", "Noto Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="bg-background-light dark:bg-background-dark font-sans text-text-main dark:text-text-dark min-h-screen flex items-center justify-center p-4">
    <div
      aria-hidden="true"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity"></div>
    <div
      class="relative z-50 w-full max-w-[600px] bg-surface-light dark:bg-surface-dark rounded-xl shadow-2xl border border-border-light dark:border-border-dark flex flex-col max-h-[90vh] overflow-hidden">
      <div
        class="flex items-center justify-between px-6 py-5 border-b border-border-light dark:border-border-dark bg-background-light/50 dark:bg-background-dark/30">
        <h2
          class="text-xl font-bold text-text-main dark:text-text-dark flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">payments</span>
          إضافة سلفة
        </h2>
        <a
          href="HR-Employee.html"
          class="text-text-muted hover:text-primary dark:text-text-muted dark:hover:text-primary transition-colors rounded-full p-1 hover:bg-border-light/50 dark:hover:bg-border-dark/50">
          <span class="material-symbols-outlined">close</span>
        </a>
      </div>
      <div class="p-6 overflow-y-auto custom-scrollbar">
        <form class="flex flex-col gap-6">
          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-semibold text-text-main dark:text-text-dark"
              for="employee-select">
              الموظف <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                autocomplete="off"
                class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-text-dark focus:border-primary focus:ring-primary h-12 pr-4 pl-10 text-base placeholder:text-text-muted/50"
                id="employee-select"
                list="employees-list"
                placeholder="ابحث باسم الموظف..."
                type="text" />
              <datalist id="employees-list">
                <option value="أحمد محمد"></option>
                <option value="سارة علي"></option>
                <option value="كريم محمود"></option>
                <option value="منى حسن"></option>
                <option value="محمود سعيد"></option>
                <option value="هدى إبراهيم"></option>
                <option value="عمر خالد"></option>
                <option value="ليلى أحمد"></option>
              </datalist>
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-text-muted">
                <span class="material-symbols-outlined text-xl">person</span>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
              <label
                class="text-sm font-semibold text-text-main dark:text-text-dark"
                for="amount-input">
                المبلغ <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <input
                  class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-text-dark focus:border-primary focus:ring-primary h-12 pr-4 pl-12 text-base placeholder:text-text-muted/50"
                  id="amount-input"
                  placeholder="0.00"
                  type="number" />
                <div
                  class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-text-muted font-bold text-sm">
                  EGP
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-2">
              <label
                class="text-sm font-semibold text-text-main dark:text-text-dark"
                for="date-input">
                تاريخ السلفة <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <input
                  class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-text-dark focus:border-primary focus:ring-primary h-12 pr-4 pl-10 text-base"
                  id="date-input"
                  type="date" />
                <div
                  class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-text-muted">
                  <span class="material-symbols-outlined text-xl"
                    >calendar_today</span
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-semibold text-text-main dark:text-text-dark"
              for="notes-input">
              ملاحظات
            </label>
            <textarea
              class="form-textarea w-full rounded-lg border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark text-text-main dark:text-text-dark focus:border-primary focus:ring-primary min-h-[100px] p-4 text-base placeholder:text-text-muted/50 resize-none"
              id="notes-input"
              placeholder="أضف أي ملاحظات إضافية هنا..."></textarea>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <span class="text-xs text-text-muted font-medium ml-1"
              >مبالغ سريعة:</span
            >
            <button
              class="px-3 py-1 bg-border-light/50 dark:bg-border-dark/30 hover:bg-primary/10 hover:text-primary hover:border-primary border border-transparent rounded-full text-xs font-medium text-text-muted transition-all"
              type="button">
              100
            </button>
            <button
              class="px-3 py-1 bg-border-light/50 dark:bg-border-dark/30 hover:bg-primary/10 hover:text-primary hover:border-primary border border-transparent rounded-full text-xs font-medium text-text-muted transition-all"
              type="button">
              200
            </button>
            <button
              class="px-3 py-1 bg-border-light/50 dark:bg-border-dark/30 hover:bg-primary/10 hover:text-primary hover:border-primary border border-transparent rounded-full text-xs font-medium text-text-muted transition-all"
              type="button">
              500
            </button>
          </div>
        </form>
      </div>
      <div
        class="flex items-center justify-end gap-3 px-6 py-5 bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark">
        <a
          href="HR-Employee.html"
          class="flex items-center justify-center px-6 h-11 rounded-lg border border-border-light dark:border-border-dark text-text-main dark:text-text-dark font-bold text-sm hover:bg-border-light/50 dark:hover:bg-border-dark/50 transition-colors">
          إلغاء
        </a>
        <button
          class="flex items-center justify-center px-8 h-11 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-md shadow-primary/20 transition-all transform active:scale-95">
          <span class="material-symbols-outlined text-[18px] ml-2">check</span>
          حفظ
        </button>
      </div>
    </div>
    <div
      class="fixed inset-0 -z-10 bg-[url('https://images.unsplash.com/photo-1453614512568-c4024d13c247?q=80&amp;w=2832&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-10 pointer-events-none"
      data-alt="Blurred background of a coffee shop interior with warm lighting"></div>
  </body>
</html>

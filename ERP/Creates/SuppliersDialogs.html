<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>إدارة الموردين - بن الغنيمي</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6F4E37",
              "primary-hover": "#5D4037",
              "background-light": "#F5F5F0",
              "background-dark": "#1F1B18",
              "surface-light": "#FFFFFF",
              "surface-dark": "#2C2522",
              "text-light": "#3E2723",
              "text-dark": "#EFEBE9",
              accent: "#D7CCC8",
              "border-light": "#E7E5E4",
              "border-dark": "#44403C",
            },
            fontFamily: {
              display: ["Cairo", "sans-serif"],
              body: ["Cairo", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
              xl: "1rem",
              "2xl": "1.5rem",
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(111, 78, 55, 0.05)",
              "soft-dark": "0 4px 20px -2px rgba(0, 0, 0, 0.4)",
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d7ccc8;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #5d4037;
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-body transition-colors duration-300 min-h-screen flex flex-col relative overflow-hidden">
    <div
      class="filter blur-[2px] pointer-events-none select-none h-screen flex flex-col">
      <nav
        class="bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark shadow-sm z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-20 items-center">
            <div class="flex items-center gap-3">
              <div
                class="bg-primary/10 dark:bg-primary/20 p-2 rounded-xl text-primary">
                <span class="material-icons-round text-3xl">coffee</span>
              </div>
              <div>
                <h1
                  class="text-xl font-bold text-primary dark:text-text-dark leading-tight">
                  بن الغنيمي
                </h1>
                <p
                  class="text-xs text-primary/80 font-semibold tracking-wide uppercase">
                  Elghonemy
                </p>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-5xl">
          <div class="text-center mb-10">
            <h2
              class="text-3xl md:text-4xl font-extrabold text-primary dark:text-text-dark mb-2">
              التكويدات
            </h2>
          </div>
          <div class="flex flex-wrap justify-center gap-6">
            <div
              class="w-full sm:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] h-48 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft"></div>
            <div
              class="w-full sm:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] h-48 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft"></div>
            <div
              class="w-full sm:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] h-48 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft"></div>
          </div>
        </div>
      </main>
    </div>
    <div
      aria-modal="true"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-background-dark/60 backdrop-blur-sm"
      role="dialog">
      <div
        class="bg-surface-light dark:bg-surface-dark w-full max-w-md rounded-2xl shadow-2xl shadow-primary/10 border border-border-light/50 dark:border-border-dark flex flex-col transform transition-all scale-100 opacity-100">
        <div
          class="px-6 py-5 border-b border-border-light dark:border-border-dark flex justify-between items-center bg-background-light/50 dark:bg-background-dark/30 rounded-t-2xl">
          <div class="flex items-center gap-3">
            <div
              class="bg-accent/20 dark:bg-accent/10 p-2 rounded-lg text-primary">
              <span class="material-icons-round text-2xl">local_shipping</span>
            </div>
            <div>
              <h3 class="text-lg font-bold text-text-light dark:text-text-dark">
                إدارة الموردين
              </h3>
              <p class="text-xs text-text-light/60 dark:text-text-dark/60">
                إضافة أو تعديل بيانات مورد
              </p>
            </div>
          </div>
          <a
            href="../Creates.html"
            class="text-text-light/50 hover:text-red-500 dark:text-text-dark/50 dark:hover:text-red-400 transition-colors p-1 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center justify-center">
            <span class="material-icons-round text-2xl">close</span>
          </a>
        </div>
        <div class="p-6 space-y-5">
          <div class="space-y-1.5">
            <label
              class="block text-sm font-bold text-text-light/80 dark:text-text-dark/80"
              for="supplier-id">
              الرقم التعريفي
            </label>
            <div class="relative">
              <span
                class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light/40 dark:text-text-dark/40 material-icons-round text-lg"
                >tag</span
              >
              <input
                class="block w-full pr-10 pl-3 py-2.5 bg-background-light dark:bg-background-dark/50 border-border-light dark:border-border-dark rounded-xl text-text-light dark:text-text-dark placeholder-text-light/30 dark:placeholder-text-dark/30 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all sm:text-sm shadow-sm"
                dir="rtl"
                id="supplier-id"
                placeholder="على سبيل المثال: 1001"
                type="text" />
            </div>
          </div>
          <div class="space-y-1.5">
            <label
              class="block text-sm font-bold text-text-light/80 dark:text-text-dark/80"
              for="supplier-name">
              الاسم
            </label>
            <div class="relative">
              <span
                class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light/40 dark:text-text-dark/40 material-icons-round text-lg"
                >badge</span
              >
              <input
                class="block w-full pr-10 pl-3 py-2.5 bg-background-light dark:bg-background-dark/50 border-border-light dark:border-border-dark rounded-xl text-text-light dark:text-text-dark placeholder-text-light/30 dark:placeholder-text-dark/30 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all sm:text-sm shadow-sm"
                dir="rtl"
                id="supplier-name"
                placeholder="اسم المورد أو الشركة"
                type="text" />
            </div>
          </div>
          <div class="space-y-1.5">
            <label
              class="block text-sm font-bold text-text-light/80 dark:text-text-dark/80"
              for="supplier-phone">
              رقم الهاتف
            </label>
            <div class="relative">
              <span
                class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light/40 dark:text-text-dark/40 material-icons-round text-lg"
                >phone</span
              >
              <input
                class="block w-full pr-10 pl-3 py-2.5 bg-background-light dark:bg-background-dark/50 border-border-light dark:border-border-dark rounded-xl text-text-light dark:text-text-dark placeholder-text-light/30 dark:placeholder-text-dark/30 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all sm:text-sm shadow-sm"
                dir="rtl"
                id="supplier-phone"
                placeholder="01xxxxxxxxx"
                type="tel" />
            </div>
          </div>
        </div>
        <div
          class="px-6 py-4 bg-background-light/30 dark:bg-background-dark/30 border-t border-border-light dark:border-border-dark rounded-b-2xl flex items-center justify-end gap-3">
          <a
            href="../Creates.html"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold text-text-light/70 dark:text-text-dark/70 hover:text-text-light dark:hover:text-text-dark hover:bg-background-light dark:hover:bg-background-dark border border-transparent hover:border-border-light dark:hover:border-border-dark transition-all duration-200 flex items-center justify-center">
            إلغاء
          </a>
          <button
            class="px-6 py-2.5 rounded-xl text-sm font-bold text-white bg-primary hover:bg-primary-hover shadow-lg shadow-primary/20 hover:shadow-primary/40 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2"
            type="button">
            <span class="material-icons-round text-base">save</span>
            <span>حفظ</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

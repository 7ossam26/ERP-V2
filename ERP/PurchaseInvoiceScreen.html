        extend: {

            primary: {

            border: {
              light: "#E6E0DD",
              dark: "#453833",

            display: ["Cairo", "sans-serif"],

              <input checked=""
                class="w-5 h-5 text-primary bg-background-light border-border-dark/30 focus:ring-primary dark:ring-offset-surface-dark focus:ring-2 dark:bg-background-dark dark:border-border-dark cursor-pointer"
                id="payment-cash" name="payment-method" type="radio" value="" />
              <label
                class="ms-3 text-sm font-bold text-text-light dark:text-text-dark w-full cursor-pointer flex items-center justify-between"
                for="payment-cash">
                <span>نقد (Cash)</span>
                <span class="material-symbols-outlined text-text-muted text-lg">monetization_on</span>
              </label>
            </div>
            <div
              class="flex items-center p-3 rounded-lg border border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-colors cursor-pointer">
              <input
                class="w-5 h-5 text-primary bg-background-light border-border-dark/30 focus:ring-primary dark:ring-offset-surface-dark focus:ring-2 dark:bg-background-dark dark:border-border-dark cursor-pointer"
                id="payment-credit" name="payment-method" type="radio" value="" />
              <label
                class="ms-3 text-sm font-bold text-text-light dark:text-text-dark w-full cursor-pointer flex items-center justify-between"
                for="payment-credit">
                <span>الآجل (Credit)</span>
                <span class="material-symbols-outlined text-text-muted text-lg">credit_score</span>
              </label>
            </div>
            <div
              class="flex items-center p-3 rounded-lg border border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-colors cursor-pointer">
              <input
                class="w-5 h-5 text-primary bg-background-light border-border-dark/30 focus:ring-primary dark:ring-offset-surface-dark focus:ring-2 dark:bg-background-dark dark:border-border-dark cursor-pointer"
                id="payment-misc" name="payment-method" type="radio" value="" />
              <label
                class="ms-3 text-sm font-bold text-text-light dark:text-text-dark w-full cursor-pointer flex items-center justify-between"
                for="payment-misc">
                <span>متنوع (Mixed)</span>
                <span class="material-symbols-outlined text-text-muted text-lg">account_balance</span>
              </label>
            </div>
          </div>
          <div
            class="hidden group-has-[#payment-misc:checked]:block space-y-4 pt-4 border-t border-dashed border-border-light dark:border-border-dark animate-fade-in bg-background-light/50 dark:bg-background-dark/30 -mx-6 px-6 pb-2">
            <div>
              <label class="block text-sm font-medium mb-1 text-text-muted dark:text-accent">مدفوع</label>
              <div class="relative">
                <input
                  class="w-full bg-surface-light dark:bg-background-dark border border-border-light dark:border-border-dark text-text-light dark:text-text-dark text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5"
                  placeholder="0.00" type="number" />
                <span
                  class="material-symbols-outlined absolute left-3 top-2.5 text-text-muted text-sm pointer-events-none">attach_money</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1 text-text-muted dark:text-accent">متبقي</label>
              <div class="relative">
                <input
                  class="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg block p-2.5 font-bold"
                  placeholder="0.00" readonly="" type="number" />
                <span
                  class="material-symbols-outlined absolute left-3 top-2.5 text-red-400 text-sm pointer-events-none">money_off</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-6 pt-4 border-t border-border-light dark:border-border-dark">
          <button
            class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-primary/30 transform hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2">
            <span class="material-symbols-outlined">print</span>
            <span>حفظ وطباعة</span>
          </button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>

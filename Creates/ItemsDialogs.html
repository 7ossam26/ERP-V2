<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>إدارة الأصناف - بن الغنيمي</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6F4E37",
              "primary-dark": "#5D4037",
              "background-light": "#F5F5F0",
              "background-dark": "#1F1B18",
              "surface-light": "#FFFFFF",
              "surface-dark": "#2C2522",
              "text-light": "#3E2723",
              "text-dark": "#EFEBE9",
              accent: "#D7CCC8",
              "border-light": "#E7E5E4",
              "border-dark": "#44403C",
            },
            fontFamily: {
              display: ["Cairo", "sans-serif"],
              body: ["Cairo", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Cairo", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark h-screen w-full overflow-hidden relative font-display">
    <div
      class="absolute inset-0 z-0 p-8 opacity-30 filter blur-[2px] pointer-events-none flex flex-col gap-6">
      <div
        class="h-16 w-full bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm"></div>
      <div class="flex gap-6 h-full">
        <div
          class="w-64 bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm hidden md:block"></div>
        <div
          class="flex-1 bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm"></div>
      </div>
    </div>
    <div
      class="relative z-10 flex h-full w-full items-center justify-center bg-black/40 backdrop-blur-sm px-4">
      <div
        class="layout-content-container flex flex-col w-full max-w-[800px] max-h-[90vh] bg-surface-light dark:bg-surface-dark rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up border border-border-light dark:border-border-dark">
        <div
          class="flex items-center justify-between px-6 py-5 border-b border-border-light dark:border-border-dark bg-surface-light/50 dark:bg-transparent">
          <div class="flex items-center gap-3">
            <div
              class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
              <span class="material-symbols-outlined text-[24px]"
                >inventory_2</span
              >
            </div>
            <div>
              <h2
                class="text-text-light dark:text-text-dark text-xl font-bold leading-tight">
                إدارة الأصناف
              </h2>
              <p class="text-sm text-text-light/60 dark:text-text-dark/60">
                إضافة أو تعديل بيانات الصنف في المخزون
              </p>
            </div>
          </div>
          <a
            href="../Creates.html"
            class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-text-light/60 dark:text-text-dark/60">
            <span class="material-symbols-outlined text-[24px]">close</span>
          </a>
        </div>
        <div class="flex-1 overflow-y-auto p-6 no-scrollbar">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <div class="md:col-span-12 flex flex-col gap-1">
              <h3
                class="text-sm font-bold text-primary dark:text-primary mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">info</span>
                البيانات الأساسية
              </h3>
            </div>
            <div class="md:col-span-4">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  الرقم التعريفي
                </p>
                <div class="relative">
                  <span
                    class="material-symbols-outlined absolute right-3 top-3.5 text-text-light/50 text-[20px]"
                    >tag</span
                  >
                  <input
                    class="form-input flex w-full rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-text-light/40 pr-10 pl-4 text-base font-medium leading-normal transition-all"
                    placeholder="مثال: 1001"
                    value="1042" />
                </div>
              </label>
            </div>
            <div class="md:col-span-8">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  اسم الصنف
                </p>
                <div class="relative">
                  <span
                    class="material-symbols-outlined absolute right-3 top-3.5 text-text-light/50 text-[20px]"
                    >coffee</span
                  >
                  <input
                    class="form-input flex w-full rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-text-light/40 pr-10 pl-4 text-base font-medium leading-normal transition-all"
                    placeholder="أدخل اسم الصنف"
                    value="بن محوج فاخر - وسط" />
                </div>
              </label>
            </div>
            <div class="md:col-span-6">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  المورد
                </p>
                <div class="relative">
                  <span
                    class="material-symbols-outlined absolute right-3 top-3.5 text-text-light/50 z-10 pointer-events-none text-[20px]"
                    >storefront</span
                  >
                  <select
                    class="form-select w-full appearance-none rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 pr-10 pl-4 text-base font-medium leading-normal transition-all cursor-pointer">
                    <option disabled="" selected="" value="">
                      اختر المورد
                    </option>
                    <option value="main_supplier">
                      المورد الرئيسي - القاهرة
                    </option>
                    <option value="brazilian_importer">
                      مستورد البن البرازيلي
                    </option>
                    <option value="yemeni_coffee">مؤسسة البن اليمني</option>
                    <option value="spices_co">شركة التوابل الشرقية</option>
                    <option value="packaging_supplies">
                      توريدات التغليف الحديثة
                    </option>
                  </select>
                  <span
                    class="material-symbols-outlined absolute left-3 top-3.5 text-text-light/50 pointer-events-none text-[24px]"
                    >arrow_drop_down</span
                  >
                </div>
              </label>
            </div>
            <div class="md:col-span-6">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  الوحدة
                </p>
                <div class="relative">
                  <span
                    class="material-symbols-outlined absolute right-3 top-3.5 text-text-light/50 z-10 pointer-events-none text-[20px]"
                    >scale</span
                  >
                  <select
                    class="form-select w-full appearance-none rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 pr-10 pl-4 text-base font-medium leading-normal transition-all cursor-pointer">
                    <option value="kg">كيلو جرام</option>
                    <option value="gm">جرام</option>
                    <option value="piece">قطعة</option>
                    <option value="box">علبة</option>
                  </select>
                  <span
                    class="material-symbols-outlined absolute left-3 top-3.5 text-text-light/50 pointer-events-none text-[24px]"
                    >arrow_drop_down</span
                  >
                </div>
              </label>
            </div>
            <div
              class="md:col-span-12 my-2 border-t border-border-light/50 dark:border-border-dark"></div>
            <div class="md:col-span-12 flex flex-col gap-1">
              <h3
                class="text-sm font-bold text-primary dark:text-primary mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]"
                  >payments</span
                >
                تفاصيل التسعير
              </h3>
            </div>
            <div class="md:col-span-6">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  سعر الشراء
                </p>
                <div class="relative group">
                  <input
                    class="form-input flex w-full rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-text-light/40 pr-4 pl-16 text-base font-medium leading-normal transition-all text-left dir-ltr"
                    placeholder="0.00"
                    type="number"
                    value="240.00" />
                  <div
                    class="absolute inset-y-0 left-0 flex items-center px-4 bg-border-light/20 dark:bg-surface-dark border-r border-border-light dark:border-border-dark rounded-l-lg text-text-light/60 dark:text-text-dark/60 font-bold text-sm">
                    ج.م
                  </div>
                </div>
              </label>
            </div>
            <div class="md:col-span-6">
              <label class="flex flex-col gap-1.5">
                <p
                  class="text-text-light dark:text-text-dark text-sm font-bold leading-normal">
                  سعر البيع
                </p>
                <div class="relative group">
                  <input
                    class="form-input flex w-full rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-text-light/40 pr-4 pl-16 text-base font-medium leading-normal transition-all text-left dir-ltr"
                    placeholder="0.00"
                    type="number"
                    value="320.00" />
                  <div
                    class="absolute inset-y-0 left-0 flex items-center px-4 bg-border-light/20 dark:bg-surface-dark border-r border-border-light dark:border-border-dark rounded-l-lg text-text-light/60 dark:text-text-dark/60 font-bold text-sm">
                    ج.م
                  </div>
                </div>
              </label>
            </div>
          </div>
        </div>
        <div
          class="px-6 py-4 bg-surface-light dark:bg-surface-dark border-t border-border-light dark:border-border-dark flex justify-end gap-3">
          <a
            href="../Creates.html"
            class="h-11 px-6 rounded-lg border border-border-light dark:border-border-dark text-text-light dark:text-text-dark font-bold hover:bg-border-light/30 dark:hover:bg-white/5 transition-all focus:outline-none focus:ring-2 focus:ring-border-light flex items-center justify-center">
            إلغاء
          </a>
          <button
            class="h-11 px-8 min-w-[120px] rounded-lg bg-primary hover:bg-primary-dark text-white font-bold shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
            <span class="material-symbols-outlined text-[20px]">save</span>
            <span>حفظ</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

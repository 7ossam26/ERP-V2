<!DOCTYPE html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>POS Login - elghonemy</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&amp;family=Manrope:wght@400;500;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#8b5e3c",
            "primary-hover": "#6f4b30",
            "background-light": "#fbfaf9",
            "background-dark": "#1d1815",
            "surface-light": "#ffffff",
            "surface-dark": "#2a2420",
            "text-main-light": "#181411",
            "text-main-dark": "#f7f7f6",
            "text-secondary-light": "#857060",
            "text-secondary-dark": "#a8988e",
            "border-light": "#e1dbd6",
            "border-dark": "#403630",
          },
          fontFamily: {
            display: ["Manrope", "Cairo", "sans-serif"],
            cairo: ["Cairo", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e1dbd6;
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #403630;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
</head>

<body
  class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-display antialiased transition-colors duration-200 flex items-center justify-center min-h-screen p-4">
  <div
    class="w-full max-w-lg mx-auto bg-surface-light dark:bg-surface-dark rounded-xl shadow-lg overflow-hidden flex flex-col">
    <div class="w-full flex flex-col p-8 sm:p-10">
      <header class="flex items-center justify-between w-full mb-8">
        <div class="flex items-center gap-3">
          <div
            class="size-10 bg-primary rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/20">
            <span class="material-symbols-outlined text-[24px]">coffee</span>
          </div>
          <div>
            <h2
              class="text-text-main-light dark:text-text-main-dark text-lg font-bold leading-none tracking-[-0.015em]">
              elghonemy
            </h2>
            <h2
              class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-cairo font-bold leading-none mt-1">
              بن الغنيمي
            </h2>
          </div>
        </div>
        <button
          class="flex items-center gap-2 px-3 py-2 rounded-lg bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark hover:border-primary transition-colors cursor-pointer group">
          <span
            class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark group-hover:text-primary text-[20px]">language</span>
          <span class="text-text-main-light dark:text-text-main-dark text-sm font-bold">EN | AR</span>
        </button>
      </header>
      <main class="flex-1 flex flex-col justify-center">
        <div class="w-full">
          <div class="mb-8">
            <h1
              class="text-text-main-light dark:text-text-main-dark tracking-tight text-[28px] sm:text-[32px] font-bold leading-tight mb-2">
              Welcome Back
            </h1>
            <p class="text-text-secondary-light dark:text-text-secondary-dark text-base font-normal">
              Please sign in to your POS terminal
            </p>
          </div>
          <form class="space-y-6" onsubmit="event.preventDefault();">
            <div class="space-y-2">
              <label class="block text-text-main-light dark:text-text-main-dark text-base font-medium">Employee ID /
                Email</label>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <span
                    class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark">badge</span>
                </div>
                <input
                  class="w-full pl-12 pr-4 h-14 bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark rounded-xl text-text-main-light dark:text-text-main-dark placeholder-text-secondary-light focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200"
                  placeholder="Enter your ID or Email" required="" type="text" />
              </div>
            </div>
            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <label
                  class="block text-text-main-light dark:text-text-main-dark text-base font-medium">Password</label>
                <a class="text-sm font-bold text-primary hover:text-primary-hover transition-colors" href="#">Forgot
                  Password?</a>
              </div>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <span
                    class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark">lock</span>
                </div>
                <input
                  class="w-full pl-12 pr-12 h-14 bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark rounded-xl text-text-main-light dark:text-text-main-dark placeholder-text-secondary-light focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200"
                  placeholder="•••••••••" required="" type="password" />
                <button
                  class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-text-secondary-light dark:text-text-secondary-dark hover:text-primary transition-colors"
                  type="button">
                  <span class="material-symbols-outlined">visibility</span>
                </button>
              </div>
            </div>
            <a class="w-full h-14 bg-primary hover:bg-primary-hover text-white rounded-xl font-bold text-base shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 mt-8"
              href="Dashboard.html">
              <span>Sign In</span>
              <span class="material-symbols-outlined text-[20px]">login</span>
            </a>
          </form>
          <div class="mt-8 text-center">
            <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm">
              Having trouble?
              <a class="text-primary hover:text-primary-hover font-bold ml-1 transition-colors" href="#">Contact
                Support</a>
            </p>
          </div>
        </div>
      </main>
      <footer class="mt-8 text-center">
        <p class="text-xs text-text-secondary-light/60 dark:text-text-secondary-dark/60 font-medium">
          POS System v2.4.0 © 2024 elghonemy Coffee.
        </p>
      </footer>
    </div>
  </div>
</body>

</html>
